<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clash of Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Clash of Cards</h1>

    <h2>Card Search</h2>
    <input id="search" type="text" placeholder="Search for a card" />

    <div class="filter-container">
      <label><input type="checkbox" id="character" checked /> Characters</label>
      <label><input type="checkbox" id="item" checked /> Items</label>
      <label><input type="checkbox" id="skillset" checked /> Skillsets</label>
      <label><input type="checkbox" id="event" checked /> Events</label>
      <label><input type="checkbox" id="art" /> Art</label>
    </div>

    <div id="results"></div>

    <!-- Modal overlay - clicking the backdrop closes it -->
    <div id="card-modal" onclick="closeModal()">
      <div class="close-hint">Click anywhere or ESC to close.</div>
      <!-- stopPropagation so clicking the card itself doesn't close the modal -->
      <div id="modal-content-wrapper" onclick="event.stopPropagation()"></div>
    </div>

    <!-- cards.js must come before app.js so the `cards` array is defined first -->
    <script src="cards.js"></script>
    <script src="app.js"></script>
  </body>
</html>
