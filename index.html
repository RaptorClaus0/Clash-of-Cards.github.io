<!doctype html>
<html>
  <head>
    <title>Clash of Cards</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(90deg, #1a1a2e 0%, #3e1616 100%);
        color: #e0e0e0;
        padding: 20px;
        min-height: 100vh;
      }

      h1 {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 30px;
        color: #00d4ff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
      }

      h2 {
        font-size: 1.3rem;
        margin-top: 25px;
        margin-bottom: 15px;
        color: #00d4ff;
      }

      #search {
        width: 100%;
        max-width: 400px;
        padding: 12px 15px;
        font-size: 16px;
        border: 2px solid #00d4ff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #e0e0e0;
        transition: all 0.3s ease;
        margin-bottom: 20px;
      }

      .filter-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 25px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        border-left: 4px solid #00d4ff;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      #results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .card {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.05) 0%,
          rgba(255, 255, 255, 0.02) 100%
        );
        border: 2px solid #00d4ff;
        border-radius: 12px;
        padding: 20px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        cursor: zoom-in;
      }

      .card:hover {
        transform: translateY(-8px);
        border-color: #00ffff;
        box-shadow: 0 8px 25px rgba(0, 212, 255, 0.2);
      }

      .card h2 {
        margin: 0 0 15px 0;
        font-size: 1.5rem;
        color: #00ffff;
        border-bottom: 2px solid #00d4ff;
        padding-bottom: 10px;
      }

      .card p {
        margin: 10px 0;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .card strong {
        color: #00d4ff;
      }

      #card-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(5px);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        padding: 20px;
        cursor: zoom-out;
      }

      #modal-content-wrapper .card {
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        background-color: rgba(26, 26, 46, 0.4);
        overflow-y: auto;
        border: 3px solid #00ffff;
        cursor: default;
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .close-hint {
        position: absolute;
        top: 20px;
        color: #00d4ff;
        font-weight: bold;
        pointer-events: none;
      }

      .card::-webkit-scrollbar {
        width: 6px;
      }
      .card::-webkit-scrollbar-thumb {
        background: #00d4ff;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>

    <h2>Card Search</h2>
    <input id="search" type="text" placeholder="Search for a card" />

      <label><input type="checkbox" id="item" checked /> Items</label>
      <label><input type="checkbox" id="skillset" checked /> Skillsets</label>
      <label><input type="checkbox" id="event" checked /> Events</label>
      <label><input type="checkbox" id="art" /> Art</label>
    </div>

    <div id="results"></div>

    <div id="card-modal" onclick="closeModal()">
      <div class="close-hint">Click anywhere to close</div>
      <div id="modal-content-wrapper" onclick="event.stopPropagation()"></div>

      // -----------------------------
      // SEARCH LOGIC
      // -----------------------------
      function filterCards() {
        const query = document.getElementById("search").value.toLowerCase();
        const showCharacter = document.getElementById("character").checked;
        const showItem = document.getElementById("item").checked;
        const showSkillset = document.getElementById("skillset").checked;
        const showEvent = document.getElementById("event").checked;
        const showArt = document.getElementById("art").checked;
        const matches = cards.filter((card) => {
          const matchesQuery = card.name.toLowerCase().includes(query);
          const matchestype =
            (card.type === "Character" && showCharacter) ||
            (card.type === "Item" && showItem) ||
            (card.type === "Skillset" && showSkillset) ||
            (card.type === "Event" && showEvent) ||
            (card.type === "Art" && showArt);
          return matchesQuery && matchestype;
        });
        displayResults(matches);
      }

      document.getElementById("search").addEventListener("input", filterCards);
      document.getElementById("character").addEventListener("change", filterCards);
      document.getElementById("item").addEventListener("change", filterCards);
      document.getElementById("skillset").addEventListener("change", filterCards);
      document.getElementById("event").addEventListener("change", filterCards);
      document.getElementById("art").addEventListener("change", filterCards);

           ${card.Archetype !== undefined ? `<p><strong>Archetype:</strong> ${card.Archetype}</p>` : ""}
           ${card.HP !== undefined ? `<p><strong>HP:</strong> ${card.HP}</p>` : ""}
           ${card.ATK !== undefined ? `<p><strong>ATK:</strong> ${card.ATK}</p>` : ""}
           ${card.DEF !== undefined ? `<p><strong>DEF:</strong> ${card.DEF}</p>` : ""}
           ${card.DEX !== undefined ? `<p><strong>DEX:</strong> ${card.DEX}</p>` : ""}
           ${card.ENG !== undefined ? `<p><strong>ENG:</strong> ${card.ENG}</p>` : ""}
           ${card.Passives !== undefined ? `<p><strong>Passives:</strong> ${card.Passives}</p>` : ""}
           ${card.Ability !== undefined ? `<p><strong>Ability:</strong> ${card.Ability}</p>` : ""}
           ${card.Active !== undefined ? `<p><strong>Active:</strong> ${card.Active}</p>` : ""}
           ${card.Extra !== undefined ? `<p><strong>Extra:</strong> ${card.Extra}</p>` : ""}
           ${card.Image !== undefined ? `<p><strong>Image:</strong> ${card.Image}</p>` : ""}
       </div>
   `;
          })
          .join("");
      }

      // -----------------------------
      // MODAL LOGIC
      // -----------------------------
      function openModal(cardElement) {
        const modal = document.getElementById("card-modal");
        const wrapper = document.getElementById("modal-content-wrapper");

        const clonedCard = cardElement.cloneNode(true);

        clonedCard.onclick = null;

        wrapper.innerHTML = "";
        wrapper.appendChild(clonedCard);

        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        document.getElementById("card-modal").style.display = "none";
        document.body.style.overflow = "auto";
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      filterCards();
    </script>
  </body>
</html>
